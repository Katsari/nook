name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Qt QML tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      # tests/all.sh skips its qmllint part without the omarchy source, so this
      # replaces it. qmlformat parses the file and ignores imports, which is
      # the whole check that is meaningful here: the runner has no qs.Commons
      # to resolve against, and qmllint's warnings and exit codes differ across
      # Qt versions. Formatting a broken file first proves the check still
      # fails when it should.
      - name: Check QML syntax
        run: |
          QMLFORMAT=$(command -v qmlformat || echo /usr/lib/qt6/bin/qmlformat)
          printf 'import QtQuick\nItem { BROKEN {{{\n' > /tmp/broken.qml
          if "$QMLFORMAT" /tmp/broken.qml > /dev/null 2>&1; then
            echo "qmlformat accepted a file with a parse error"
            exit 1
          fi
          "$QMLFORMAT" BarWidget.qml > /dev/null

      - name: Run tests
        run: tests/all.sh
